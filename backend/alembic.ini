# Alembic: database schema migrations. Run from backend/:
#   uv run alembic upgrade head                                 apply every migration
#   uv run alembic revision --autogenerate -m "what changes"   new migration from the models
#   uv run alembic upgrade head --sql > db/schema.sql           full SQL script of the schema
# The database URL comes from the settings (DATABASE_URL or POSTGRES_*),
# see alembic/env.py: there is no sqlalchemy.url here.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Migration files: <revision>_<slug>.py
file_template = %%(rev)s_%%(slug)s
output_encoding = utf-8

[post_write_hooks]
# New migration files are linted and formatted like the rest of the code.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
