[project]
name = "easy-diligence"
version = "0.1.0"
description = "Easy Diligence: AI-assisted due diligence of investment funds"
authors = [
    {name = "Easy-Diligence contributors"}
]
requires-python = ">=3.12"
keywords = ["due-diligence", "automation", "ai", "fastapi", "openai"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Database: PostgreSQL through psycopg 3; models are SQLModel (SQLAlchemy +
    # Pydantic); the schema is versioned with Alembic.
    "sqlalchemy>=2.0.23,<2.1",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # AI
    # Pinned: the engine (Responses API parameters, compaction via extra_body)
    # was tuned and measured on this exact SDK version.
    "openai==2.2.0",
    # Cache (falls back to memory when Redis is unreachable)
    "redis==5.0.1",
    # Uploads (FastAPI form and file parsing)
    "python-multipart>=0.0.31",
    # Validation & configuration (pydantic-settings reads backend/.env)
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    # Authentication & security
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    # Email
    "aiosmtplib>=5.1.2",
    "jinja2>=3.1.6",
    # Exports
    "reportlab>=4.4.4",
    "pandas>=2.3.2,<3",
    "openpyxl>=3.1.5",
    # Command line (app/cli.py)
    "typer>=0.12",
]

# Installed by `uv sync`, left out of the Docker image by `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "pytest-mock>=3.14",
    "pytest-env>=1.1",
    "httpx>=0.27",  # FastAPI's TestClient
    "ruff>=0.17",
    "mypy>=1.18",
    "pre-commit>=4",
    "pip-audit>=2.9",
]

[tool.uv]
required-version = ">=0.9.17"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff: lint and format ------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "G004", # logging with an f-string: arguments go as %s, formatted only if logged
]
ignore = [
    "E501",  # line length: left to the formatter
    "B008",  # Depends(...) in argument defaults is how FastAPI declares dependencies
    "E712",  # `column == True` builds a SQLAlchemy filter; `is True` would break it
    "UP042", # (str, Enum) members format differently from StrEnum ones: kept as is
    "UP046", # Pydantic generic models keep the Generic[T] spelling
]
# Older code carries `# noqa: <rule>` where it breaks a rule (mostly B904,
# raise without `from`): new code is held to every rule, and each marker goes
# away as the module around it is reworked.

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# The scripts put backend/ on sys.path before importing the app.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The library, not backend/alembic/ (the migrations folder of the same name).
known-third-party = ["alembic"]

# --- Mypy -------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
# Permissive start: most of the code has no annotations yet. Tighten module by
# module, through [[tool.mypy.overrides]], as the code is refactored.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# --- Pytest -----------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: API tests",
    "auth: authentication tests",
    "db: tests that need a database",
    "postgres: checks only PostgreSQL can show; skipped on SQLite (TEST_POSTGRES_URL)",
]
# Test settings, set by pytest-env before anything is imported. Environment
# variables win over backend/.env, so a test can never reach a real database
# or a real OpenAI key, whatever that file contains.
env = [
    "DATABASE_URL=sqlite://",
    "OPENAI_API_KEY=sk-test-not-a-real-key",
    "JWT_SECRET_KEY=test-only-jwt-secret-not-for-production",
    "REDIS_URL=redis://127.0.0.1:1/0",
    "DOCS_ENABLED=true",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
