[project]
name = "due-diligence-automation"
version = "1.0.0"
description = "AI-powered Due Diligence Automation Platform"
authors = [
    {name = "Easy-Diligence contributors"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["due-diligence", "automation", "ai", "fastapi", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial",
]

# Production Dependencies
dependencies = [
    # Web Framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Database
    "sqlalchemy>=2.0.23,<2.1",
    "pymysql>=1.1.1",
    "cryptography>=46",
    # AI & Machine Learning
    # Pinned: the engine (Responses API parameters, compaction via extra_body)
    # was tuned and measured on this exact SDK version.
    "openai==2.2.0",
    # Caching & Message Queue
    "redis==5.0.1",
    "celery==5.3.4",
    # Web & File Handling
    "python-multipart>=0.0.31",
    "websockets==12.0",
    "aiofiles==23.2.1",
    "httpx>=0.27",
    # Data Validation & Configuration
    "pydantic[email]>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.2.2",
    "python-dateutil==2.8.2",
    # Authentication & Security
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "email-validator>=2.2",
    # Email
    "aiosmtplib>=5.1.2",
    "jinja2>=3.1.6",
    # Exports
    "reportlab>=4.4.4",
    "pandas>=2.3.2,<3",
    "openpyxl>=3.1.5",
    # Command line (app/cli.py)
    "typer>=0.12",
]

# Optional Dependencies
[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-mock==3.12.0",
    "pytest-env>=1.1",
    "fakeredis==2.20.1",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
    "pre-commit>=3.0.0",
]

# Production monitoring and profiling
monitoring = [
    "sentry-sdk[fastapi]>=1.38.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Tool configurations
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
target-version = ['py311']
line-length = 100
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: API tests",
    "auth: authentication tests",
    "db: tests that need a database",
]
# Test settings, set by pytest-env before anything is imported. Environment
# variables win over backend/.env, so a test can never reach a real database
# or a real OpenAI key, whatever that file contains.
env = [
    "DATABASE_URL=sqlite://",
    "OPENAI_API_KEY=sk-test-not-a-real-key",
    "JWT_SECRET_KEY=test-only-jwt-secret-not-for-production",
    "REDIS_URL=redis://127.0.0.1:1/0",
    "DOCS_ENABLED=true",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
