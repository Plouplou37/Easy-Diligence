# The entry point, the only service reachable from outside. /api (and the API
# documentation, when DOCS_ENABLED opens it) goes to the backend, everything
# else to the frontend. The services are reached by their compose name.
#
# Every rule about the traffic lives here: the size of what is sent, the time
# allowed, the security headers. HTTPS, when it comes, ends here too.

server {
    listen 80;
    server_tokens off;

    # Documents sent to the vector stores: MAX_UPLOAD_SIZE (100 MB), and the
    # form around them.
    client_max_body_size 110m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The client's address, as this proxy sees it. Set, not appended: an
    # X-Forwarded-For sent by the client would otherwise pick the address the
    # login limits count.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        proxy_pass http://backend:8000;
        # A regeneration, or summaries written on the spot, wait on OpenAI for
        # minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Uploads go on to the backend as they come, not spooled to disk first.
        proxy_request_buffering off;
    }

    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
