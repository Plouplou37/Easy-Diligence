# The built application, as static files. This server only serves files: the
# routing (/api to the backend), the limits and the security headers are the
# proxy's (proxy/default.conf.template).

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built files carry a hash in their name: they never change, cache them.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Any other path is a route of the application (React Router): it gets
    # index.html, never cached, so that a new version is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
