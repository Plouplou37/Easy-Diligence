# Easy Diligence: `docker compose up -d --build` (README, "Démarrage avec Docker").
#
#   navigateur ──► proxy ──/api──► backend ──► db
#                    └──── / ────► frontend
#
# Four services, reached by their name on the compose network. Only the proxy
# publishes a port: the database and the backend cannot be reached from the
# machine. The settings come from .env, at the root (copied from .env.template).
# The image versions are in VERSION.md.

name: easy-diligence

services:
  db:
    image: postgres:17.12-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      # The database is the `db` service, whatever .env says for a run by hand.
      POSTGRES_HOST: db
      DATABASE_URL: ""
    volumes:
      # The optional banner of the PDF reports: BRAND_BANNER_PATH set to
      # /app/branding/<file> in .env. Without a branding/ folder, Docker creates
      # an empty one, and the reports have no banner.
      - ./branding:/app/branding:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  proxy:
    build: ./proxy
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
