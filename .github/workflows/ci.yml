name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL, for the migrations and a second run of the tests:
    # SQLite does not check what is PostgreSQL's own (JSONB, partial indexes,
    # CHECK constraints, time zones). Throwaway credentials of this CI only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: easy_diligence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d easy_diligence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # A full version: since v8, setup-uv publishes no major tag (v10).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy app

      - name: Tests (SQLite)
        run: uv run pytest

      # DATABASE_URL is set for these steps only: the tests keep their SQLite
      # (pytest-env), and nothing else reaches this database.
      - name: Migrations apply on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: uv run alembic upgrade head

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: uv run alembic check

      # Down to nothing, then up again: every downgrade is run once.
      - name: Migrations go down and up again
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: db/schema.sql is up to date
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: |
          uv run alembic upgrade head --sql > "$RUNNER_TEMP/schema.sql"
          diff -u db/schema.sql "$RUNNER_TEMP/schema.sql"

      # The whole suite again, on the schema the migrations build, plus the
      # tests marked `postgres`. TEST_POSTGRES_URL is read by tests/conftest.py
      # only, which refuses any host but this machine: the tests empty every
      # table.
      - name: Tests (PostgreSQL)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: uv run pytest

      - name: Known vulnerabilities
        run: uv run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # No warning allowed (--max-warnings 0), and the FSD layers are enforced.
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

  # The whole application as docker compose runs it: the four images built,
  # started, and used through the proxy. Throwaway settings of this CI only.
  docker:
    runs-on: ubuntu-24.04
    env:
      ADMIN_PASSWORD: Ci-Throwaway-Passw0rd
    steps:
      - uses: actions/checkout@v7

      - name: Configuration
        run: |
          cp .env.template .env
          sed -i "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-throwaway/" .env
          sed -i "s/^OPENAI_API_KEY=$/OPENAI_API_KEY=sk-test-not-a-real-key/" .env
          sed -i "s/^JWT_SECRET_KEY=$/JWT_SECRET_KEY=$(openssl rand -hex 32)/" .env

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: The application, through the proxy
        run: |
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          # A route of the application, not a file: index.html all the same.
          curl -fsS http://localhost:8080/session/EXAMPLE | grep -q 'id="root"'
          headers=$(curl -fsS -D - -o /dev/null http://localhost:8080/)
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: deny'

      # The login is an OAuth2 form (username carries the email), not JSON.
      - name: The API, through the proxy
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/login \
            --data-urlencode "username=nobody@example.com" --data-urlencode "password=not-the-one")
          test "$status" = 401

      - name: First administrator, then a login
        run: |
          printf '%s\n%s\n' "$ADMIN_PASSWORD" "$ADMIN_PASSWORD" \
            | docker compose exec -T backend python -m app.cli create-admin admin@example.com "Admin Example"
          curl -fsS http://localhost:8080/api/auth/login \
            --data-urlencode "username=admin@example.com" --data-urlencode "password=$ADMIN_PASSWORD" \
            | grep -q access_token

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
