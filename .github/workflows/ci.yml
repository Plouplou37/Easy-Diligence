name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL for the migrations: the tests run on SQLite, and nothing
    # else checks what is PostgreSQL's own (JSONB, partial indexes, NULLS NOT
    # DISTINCT, CHECK constraints). Throwaway credentials of this CI only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: easy_diligence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d easy_diligence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy app

      - name: Tests
        run: uv run pytest

      # DATABASE_URL is set for these steps only: the tests keep their SQLite
      # (pytest-env), and nothing else reaches this database.
      - name: Migrations apply on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: uv run alembic upgrade head

      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: uv run alembic check

      # Down to nothing, then up again: every downgrade is run once.
      - name: Migrations go down and up again
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: db/schema.sql is up to date
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/easy_diligence_ci
        run: |
          uv run alembic upgrade head --sql > "$RUNNER_TEMP/schema.sql"
          diff -u db/schema.sql "$RUNNER_TEMP/schema.sql"

      - name: Known vulnerabilities
        run: uv run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # No warning allowed (--max-warnings 0), and the FSD layers are enforced.
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build
